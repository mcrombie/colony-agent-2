name: Advance Colony

on:
  schedule:
    - cron: "37 12 * * *"
  workflow_dispatch:
    inputs:
      email_only:
        description: Send the latest saved report without advancing the colony
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/advance-colony.yml']

permissions:
  contents: write

concurrency:
  group: varenhold-daily
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COLONY_DIRECTOR: ${{ vars.COLONY_DIRECTOR || 'local' }}
      COLONY_AI_INTERVAL: ${{ vars.COLONY_AI_INTERVAL || '7' }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the optional Claude client only when enabled
        if: env.COLONY_DIRECTOR == 'claude'
        continue-on-error: true
        run: python -m pip install '.[claude]'

      - name: Advance one UTC day and refresh the atlas
        if: inputs.email_only != true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python -m src.run_day

      - name: Commit the world and atlas together
        if: inputs.email_only != true
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state.json src/history.md src/events.jsonl docs/index.html docs/colony.svg docs/history.md
          if git diff --cached --quiet; then
            echo "Already advanced today; no changes to commit."
            exit 0
          fi
          git commit -m "Advance Varenhold river commons [skip ci]"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "$DEFAULT_BRANCH"; then
              git rebase --abort || true
              echo "Concurrent changes conflict with this day; leaving the remote untouched. Rerun the workflow."
              exit 1
            fi
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1

      - name: Send the daily email report
        id: email
        if: vars.COLONY_EMAIL_ENABLED == 'true' && github.event_name != 'push'
        timeout-minutes: 2
        env:
          COLONY_EMAIL_ENABLED: 'true'
          COLONY_EMAIL_TO: ${{ secrets.COLONY_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          COLONY_DASHBOARD_URL: ${{ vars.COLONY_DASHBOARD_URL }}
          COLONY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m src.email_delivery

      - name: Commit the email receipt
        if: steps.email.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/email_delivery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record daily email delivery [skip ci]"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "$DEFAULT_BRANCH"; then
              git rebase --abort || true
              echo "Email was accepted, but receipt conflicted. Check the inbox before retrying."
              exit 1
            fi
            if git push origin "HEAD:$DEFAULT_BRANCH"; then exit 0; fi
            sleep "$attempt"
          done
          echo "Email was accepted, but receipt push failed. Check the inbox before retrying."
          exit 1

      - name: Save a downloadable offline atlas
        uses: actions/upload-artifact@v4
        with:
          name: varenhold-atlas
          path: docs/
          retention-days: 7

      - name: Write the run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s = json.loads(Path("src/state.json").read_text())
          c = s["commons"]
          print(f"### Varenhold · completed day {s['day'] - 1}")
          print(f"UTC date: {s['last_run_date']} · Council: {c['council']['guild']}")
          print(f"Citizens: {s['population']} · Food: {s['food']} · Timber: {s['wood']}")
          print(f"API attempts since charter: {c['api_attempts']}. Local turns use no paid API.")
          print("Download **varenhold-atlas** and open index.html to explore the map and chronicle.")
          PY
