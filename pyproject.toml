[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "colony-agent-2"
version = "0.2.0"
description = "Varenhold River Commons: a daily civic colony with optional Claude advice."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40.0,<1"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["state.json", "history.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]
